services:
  - type: web
    name: heartbeat-api
    runtime: python
    rootDir: backend
    buildCommand: |
      pip install -r requirements.txt
      python manage.py collectstatic --noinput
      python manage.py migrate
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 3 --log-file -
    healthCheckPath: /health/
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: DJANGO_ENV
        value: "production"
      - key: ALLOWED_HOSTS
        value: "*.onrender.com,localhost"
      - key: DB_NAME
        sync: false
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: CELERY_BROKER_URL
        fromService:
          type: redis
          name: heartbeat-redis
          property: connectionString
      - key: ENCRYPTION_KEY
        sync: false
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false

  - type: worker
    name: heartbeat-worker
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: celery -A config worker -l info --concurrency=4
    envVars:
      - key: DJANGO_SECRET_KEY
        sync: false
      - key: DJANGO_ENV
        value: "production"
      - key: DB_NAME
        sync: false
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: CELERY_BROKER_URL
        fromService:
          type: redis
          name: heartbeat-redis
          property: connectionString
      - key: ENCRYPTION_KEY
        sync: false

  - type: worker
    name: heartbeat-beat
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: celery -A config beat -l info
    envVars:
      - key: DJANGO_SECRET_KEY
        sync: false
      - key: DJANGO_ENV
        value: "production"
      - key: DB_NAME
        sync: false
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: CELERY_BROKER_URL
        fromService:
          type: redis
          name: heartbeat-redis
          property: connectionString
      - key: ENCRYPTION_KEY
        sync: false

  - type: redis
    name: heartbeat-redis
    ipAllowList: []
    plan: free